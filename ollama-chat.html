<!DOCTYPE html>
<html>
<head>
  <title>Ollama Chatbot</title>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&display=swap" rel="stylesheet">
 
<style>
* { box-sizing: border-box; }
 
body {
  margin: 0;
  font-family: 'EB Garamond', serif;
  background: #3f4a4f;
  color: white;
  display: flex;
  height: 100vh;
}
 
/* ─── LOGIN PAGE ─── */
#loginPage {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100vh;
  background: #3f4a4f;
  gap: 0;
}
 
.login-title {
  position: absolute;
  top: 40px;
  left: 50px;
  font-size: 32px;
  font-weight: 400;
  letter-spacing: 1px;
}
 
.login-avatar {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: #6dd3c7;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 56px;
  margin-bottom: 36px;
  box-shadow: 0 0 0 6px #2f3437;
}
 
.login-form {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: 300px;
}
 
.login-label {
  display: flex;
  flex-direction: column;
  gap: 5px;
  font-size: 15px;
  color: #ccc;
}
 
.login-label input {
  padding: 10px 14px;
  border-radius: 10px;
  border: none;
  background: #2f3437;
  color: white;
  font-family: 'EB Garamond', serif;
  font-size: 15px;
  outline: none;
  transition: box-shadow 0.2s;
}
 
.login-label input:focus {
  box-shadow: 0 0 0 2px #6dd3c7;
}
 
.login-error {
  color: #ff8888;
  font-size: 13px;
  min-height: 18px;
  text-align: center;
}
 
.login-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 6px;
}
 
.login-btn {
  padding: 12px;
  border: none;
  border-radius: 12px;
  background: #6dd3c7;
  color: #1a1a1a;
  font-family: 'EB Garamond', serif;
  font-size: 15px;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
}
 
.login-btn:hover { background: #52c0b4; }
.login-btn:active { transform: scale(0.98); }
 
.login-btn.secondary {
  background: #3a4347;
  color: #ccc;
}
 
.login-btn.secondary:hover { background: #454e52; }
 
/* ─── CHAT APP ─── */
#appPage {
  display: none;
  width: 100%;
  height: 100vh;
}
 
.app-inner {
  display: flex;
  width: 100%;
  height: 100%;
}
 
.sidebar {
  width: 260px;
  background: #2f3437;
  padding: 20px;
  overflow-y: auto;
  flex-shrink: 0;
}
 
.sidebar h2 {
  font-size: 18px;
  font-weight: 400;
}
 
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: #49636b;
  padding: 20px;
  min-width: 0;
}
 
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
 
.top-controls {
  display: flex;
  gap: 15px;
}
 
.pill {
  background: #e6e6e6;
  color: #333;
  padding: 8px 14px;
  border-radius: 20px;
  font-size: 14px;
  border: none;
  font-family: 'EB Garamond', serif;
  cursor: pointer;
}
 
.profile {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: #6dd3c7;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  cursor: pointer;
  transition: background 0.2s;
}
 
.profile:hover { background: #52c0b4; }
 
.chat-wrapper {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 0;
}
 
#chat {
  width: 80%;
  max-width: 800px;
  height: 60vh;
  background: #9fb1b7;
  border-radius: 18px;
  padding: 15px;
  overflow-y: auto;
  color: black;
}
 
.bottom-bar {
  display: flex;
  justify-content: center;
  margin-top: 20px;
}
 
.input-container {
  width: 80%;
  max-width: 800px;
  display: flex;
  align-items: center;
  gap: 10px;
}
 
#input {
  flex: 1;
  padding: 14px;
  border-radius: 20px;
  border: none;
  font-size: 16px;
  font-family: 'EB Garamond', serif;
}
 
.send-btn {
  background: #6dd3c7;
  border: none;
  padding: 12px 20px;
  border-radius: 12px;
  font-size: 18px;
  cursor: pointer;
}
 
.icon-btn {
  background: #e6e6e6;
  border: none;
  border-radius: 12px;
  padding: 10px;
  cursor: pointer;
}
 
.message {
  margin-bottom: 10px;
  padding: 8px;
  border-radius: 8px;
  word-wrap: break-word;
  overflow-wrap: break-word;
  word-break: break-word;
}
 
.user-message { background: #d6ecff; }
.ai-message { background: #e6ffe6; }
.error-message { background: #ffd6d6; }
 
/* ─── SETTINGS PANEL ─── */
.settings-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.4);
  display: none;
  justify-content: flex-end;
  z-index: 100;
}
 
.settings-panel {
  width: 320px;
  height: 100%;
  background: #2f3437;
  padding: 25px;
  display: flex;
  flex-direction: column;
  gap: 15px;
}
 
.settings-panel h2 {
  margin: 0 0 10px 0;
  font-weight: 400;
}
 
.settings-field {
  display: flex;
  flex-direction: column;
}
 
.settings-field label {
  font-size: 13px;
  margin-bottom: 5px;
}
 
.settings-field input {
  padding: 10px;
  border-radius: 10px;
  border: none;
  font-family: 'EB Garamond', serif;
  font-size: 14px;
}
 
.settings-btn {
  padding: 12px;
  border: none;
  border-radius: 12px;
  background: #6dd3c7;
  color: #1a1a1a;
  cursor: pointer;
  font-size: 14px;
  font-family: 'EB Garamond', serif;
  transition: background 0.2s;
}
 
.settings-btn:hover { background: #52c0b4; }
 
.logout-btn {
  margin-top: auto;
  background: #ff6b6b !important;
  color: white;
}
 
.logout-btn:hover { background: #e85555 !important; }
 
/* ─── MODAL OVERLAYS (signup / change-password) ─── */
.modal-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.55);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
}
 
.modal-overlay.active {
  display: flex;
}
 
.modal-box {
  background: #2f3437;
  border-radius: 18px;
  padding: 32px 28px;
  width: 340px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.5);
}
 
.modal-box h3 {
  margin: 0 0 4px 0;
  font-size: 22px;
  font-weight: 400;
}
 
.modal-field {
  display: flex;
  flex-direction: column;
  gap: 5px;
  font-size: 14px;
  color: #ccc;
}
 
.modal-field input {
  padding: 10px 14px;
  border-radius: 10px;
  border: none;
  background: #3a4347;
  color: white;
  font-family: 'EB Garamond', serif;
  font-size: 15px;
  outline: none;
  transition: box-shadow 0.2s;
}
 
.modal-field input:focus {
  box-shadow: 0 0 0 2px #6dd3c7;
}
 
.modal-error {
  color: #ff8888;
  font-size: 13px;
  min-height: 16px;
}
 
.modal-success {
  color: #6dd3c7;
  font-size: 13px;
  min-height: 16px;
}
 
.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 4px;
}
 
.modal-btn {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 12px;
  background: #6dd3c7;
  color: #1a1a1a;
  font-family: 'EB Garamond', serif;
  font-size: 15px;
  cursor: pointer;
  transition: background 0.2s;
}
 
.modal-btn:hover { background: #52c0b4; }
 
.modal-btn.cancel {
  background: #3a4347;
  color: #ccc;
}
 
.modal-btn.cancel:hover { background: #454e52; }
 
@media (max-width: 800px) {
  .sidebar { display: none; }
  #chat { width: 100%; height: 50vh; }
  .input-container { width: 100%; }
}
</style>
</head>
<body>
 
<!-- ════════════════════════════════════════
     LOGIN PAGE
════════════════════════════════════════ -->
<div id="loginPage">
  <div class="login-title">Sign In</div>
 
  <div class="login-avatar">👤</div>
 
  <div class="login-form">
    <label class="login-label">
      email:
      <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email">
    </label>
    <label class="login-label">
      password:
      <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
    </label>
    <div class="login-error" id="loginError"></div>
    <div class="login-actions">
      <button class="login-btn" onclick="doLogin()">Sign In</button>
      <button class="login-btn secondary" onclick="openSignupModal()">Sign Up</button>
    </div>
  </div>
</div>
 
<!-- ════════════════════════════════════════
     CHAT APP
════════════════════════════════════════ -->
<div id="appPage">
  <div class="app-inner">
 
    <div class="sidebar">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2>Chat history</h2>
        <button class="icon-btn" onclick="clearAllChats()">🗑️</button>
      </div>
    </div>
 
    <div class="main">
 
      <div class="topbar">
        <div class="top-controls">
 
          <select id="model" class="pill">
            <option value="llava:latest">LLaVA</option>
            <option value="qwen2.5-coder:7b">Qwen</option>
            <option value="dolphin-mistral:latest">Mistral</option>
          </select>
        </div>
 
        <div class="profile" onclick="toggleSettings()">👤</div>
      </div>
 
      <div class="chat-wrapper">
        <div id="chat"></div>
      </div>
 
      <div class="bottom-bar">
        <div class="input-container">
          <button class="icon-btn" onclick="clearChat()">🔄</button>
          <input type="text" id="input" placeholder="Type message..."
            onkeypress="if(event.key==='Enter'){sendMessage()}">
          <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
      </div>
 
    </div>
  </div>
</div>
 
<!-- ════════════════════════════════════════
     SETTINGS PANEL
════════════════════════════════════════ -->
<div class="settings-overlay" id="settingsOverlay" onclick="outsideClick(event)">
  <div class="settings-panel">
    <h2>Account</h2>
 
    <div class="settings-field">
      <label>Name</label>
      <input type="text" id="settingsName" placeholder="Your name">
    </div>
 
    <div class="settings-field">
      <label>Email</label>
      <input type="email" id="settingsEmail" placeholder="Your email" readonly style="opacity:0.6;">
    </div>
 
    <button class="settings-btn" onclick="openChangePasswordModal()">Change Password</button>
 
    <button class="settings-btn logout-btn" onclick="doLogout()">Log Out</button>
  </div>
</div>
 
<!-- ════════════════════════════════════════
     SIGN UP MODAL
════════════════════════════════════════ -->
<div class="modal-overlay" id="signupModal">
  <div class="modal-box">
    <h3>Create Account</h3>
 
    <div class="modal-field">
      <label>Email</label>
      <input type="email" id="signupEmail" placeholder="you@example.com">
    </div>
    <div class="modal-field">
      <label>Password</label>
      <input type="password" id="signupPassword" placeholder="Choose a password">
    </div>
    <div class="modal-field">
      <label>Confirm Password</label>
      <input type="password" id="signupConfirm" placeholder="Repeat password">
    </div>
 
    <div class="modal-error" id="signupError"></div>
 
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeSignupModal()">Cancel</button>
      <button class="modal-btn" onclick="doSignup()">Sign Up</button>
    </div>
  </div>
</div>
 
<!-- ════════════════════════════════════════
     CHANGE PASSWORD MODAL
════════════════════════════════════════ -->
<div class="modal-overlay" id="changePasswordModal">
  <div class="modal-box">
    <h3>Change Password</h3>
 
    <div class="modal-field">
      <label>Current Password</label>
      <input type="password" id="cpOld" placeholder="Your current password">
    </div>
    <div class="modal-field">
      <label>New Password</label>
      <input type="password" id="cpNew" placeholder="New password">
    </div>
    <div class="modal-field">
      <label>Confirm New Password</label>
      <input type="password" id="cpConfirm" placeholder="Repeat new password">
    </div>
 
    <div class="modal-error" id="cpError"></div>
    <div class="modal-success" id="cpSuccess"></div>
 
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeChangePasswordModal()">Cancel</button>
      <button class="modal-btn" onclick="doChangePassword()">Update</button>
    </div>
  </div>
</div>
 
<script>
 
// ── Simple in-memory user store (keyed by email) ──
// Structure: { email: { password, name } }
const users = {};
 
// Currently logged-in user email
let currentUser = null;
 
// ── Page switchers ──
function showLoginPage() {
  document.getElementById('loginPage').style.display = 'flex';
  document.getElementById('appPage').style.display = 'none';
  document.getElementById('settingsOverlay').style.display = 'none';
  document.getElementById('loginEmail').value = '';
  document.getElementById('loginPassword').value = '';
  document.getElementById('loginError').textContent = '';
}
 
function showAppPage() {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('appPage').style.display = 'block';
  // Populate settings email
  if (currentUser) {
    document.getElementById('settingsEmail').value = currentUser;
    document.getElementById('settingsName').value = users[currentUser]?.name || '';
  }
  document.getElementById('chat').innerHTML = '';
  currentSessionId = null;
  loadChats();
  setTimeout(() => document.getElementById('input').focus(), 100);
}
 
// ── Auth ──
function doLogin() {
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
 
  if (!email || !password) { errEl.textContent = 'Please enter email and password.'; return; }
  if (!users[email]) { errEl.textContent = 'No account found with that email.'; return; }
  if (users[email].password !== password) { errEl.textContent = 'Incorrect password.'; return; }
 
  currentUser = email;
  errEl.textContent = '';
  showAppPage();
}
 
function doLogout() {
  currentUser = null;
  showLoginPage();
}
 
// ── Sign Up Modal ──
function openSignupModal() {
  document.getElementById('signupEmail').value = '';
  document.getElementById('signupPassword').value = '';
  document.getElementById('signupConfirm').value = '';
  document.getElementById('signupError').textContent = '';
  document.getElementById('signupModal').classList.add('active');
}
 
function closeSignupModal() {
  document.getElementById('signupModal').classList.remove('active');
}
 
function doSignup() {
  const email = document.getElementById('signupEmail').value.trim().toLowerCase();
  const password = document.getElementById('signupPassword').value;
  const confirm = document.getElementById('signupConfirm').value;
  const errEl = document.getElementById('signupError');
 
  if (!email || !password) { errEl.textContent = 'Please fill in all fields.'; return; }
  if (!/\S+@\S+\.\S+/.test(email)) { errEl.textContent = 'Enter a valid email address.'; return; }
  if (password.length < 6) { errEl.textContent = 'Password must be at least 6 characters.'; return; }
  if (password !== confirm) { errEl.textContent = 'Passwords do not match.'; return; }
  if (users[email]) { errEl.textContent = 'An account with that email already exists.'; return; }
 
  users[email] = { password, name: '' };
  closeSignupModal();
 
  // Pre-fill login
  document.getElementById('loginEmail').value = email;
  document.getElementById('loginPassword').value = '';
  document.getElementById('loginError').textContent = 'Account created! Please sign in.';
}
 
// ── Change Password Modal ──
function openChangePasswordModal() {
  document.getElementById('cpOld').value = '';
  document.getElementById('cpNew').value = '';
  document.getElementById('cpConfirm').value = '';
  document.getElementById('cpError').textContent = '';
  document.getElementById('cpSuccess').textContent = '';
  document.getElementById('changePasswordModal').classList.add('active');
}
 
function closeChangePasswordModal() {
  document.getElementById('changePasswordModal').classList.remove('active');
}
 
function doChangePassword() {
  const oldPw = document.getElementById('cpOld').value;
  const newPw = document.getElementById('cpNew').value;
  const confirm = document.getElementById('cpConfirm').value;
  const errEl = document.getElementById('cpError');
  const sucEl = document.getElementById('cpSuccess');
 
  errEl.textContent = '';
  sucEl.textContent = '';
 
  if (!currentUser) return;
 
  if (users[currentUser].password !== oldPw) {
    errEl.textContent = 'Current password is incorrect.';
    return;
  }
  if (newPw.length < 6) { errEl.textContent = 'New password must be at least 6 characters.'; return; }
  if (newPw !== confirm) { errEl.textContent = 'New passwords do not match.'; return; }
 
  users[currentUser].password = newPw;
  sucEl.textContent = 'Password updated successfully!';
  setTimeout(closeChangePasswordModal, 1400);
}
 
// ── Settings panel ──
function toggleSettings() {
  const el = document.getElementById('settingsOverlay');
  el.style.display = el.style.display === 'flex' ? 'none' : 'flex';
}
 
function outsideClick(e) {
  if (e.target.id === 'settingsOverlay') toggleSettings();
}
 
// ── Chat ──
let chatHistory = [];
let currentSessionId = null;
 
function addMessage(content, type) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = `message ${type}-message`;
  div.innerHTML = `<strong>${type === 'user' ? 'You' : 'AI'}:</strong> ${content}`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
 
function addLoadingMessage() {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.id = 'loading';
  div.innerText = "Thinking...";
  chat.appendChild(div);
  return div;
}
 
function removeLoadingMessage() {
  const el = document.getElementById('loading');
  if (el) el.remove();
}
 
async function sendMessage() {
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const message = input.value.trim();
  const model = document.getElementById('model').value;
 
  if (!message) return;
 
  addMessage(message, 'user');
  input.value = '';
  sendBtn.disabled = true;
 
  const loading = addLoadingMessage();
 
  try {
    const response = await fetch('http://localhost:8000/api/generate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        model,
        prompt: message,
        files: [],
        session_id: currentSessionId || (currentUser + '::' + crypto.randomUUID()),
        rag_enabled: true
      })
    });
 
    const data = await response.json();
    removeLoadingMessage();
    currentSessionId = data.session_id;
    addMessage(data.response || "No response", 'ai');
    loadChats();
  } catch (err) {
    removeLoadingMessage();
    addMessage("Error: " + err.message, 'error');
  }
 
  sendBtn.disabled = false;
}
 
async function loadChats() {
  try {
    const res = await fetch('http://localhost:8000/api/chats');
    const chats = (await res.json()).filter(c => c.id.startsWith(currentUser + '::'));
 
    const sidebar = document.querySelector('.sidebar');
    sidebar.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h2>Chat history</h2>
        <button class="icon-btn" onclick="clearAllChats()">🗑️</button>
      </div>
    `;
 
    chats.reverse().forEach(chat => {
      const wrapper = document.createElement('div');
      wrapper.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;background:#3a3f42;padding:6px;border-radius:6px;';
 
      const title = document.createElement('div');
      title.style.cursor = 'pointer';
      title.innerText = chat.preview || "New Chat";
      title.onclick = () => loadChat(chat.id);
 
      const delBtn = document.createElement('button');
      delBtn.innerText = '❌';
      delBtn.style.cssText = 'background:transparent;border:none;cursor:pointer;color:white;';
      delBtn.onclick = async (e) => {
        e.stopPropagation();
        await fetch(`http://localhost:8000/api/chats/${chat.id}`, { method: 'DELETE' });
        loadChats();
      };
 
      wrapper.appendChild(title);
      wrapper.appendChild(delBtn);
      sidebar.appendChild(wrapper);
    });
  } catch(e) {
    // backend not available, silently ignore
  }
}
 
async function loadChat(sessionId) {
  try {
    const res = await fetch(`http://localhost:8000/api/chats/${sessionId}`);
    const chat = await res.json();
    currentSessionId = sessionId;
    document.getElementById('chat').innerHTML = '';
    chat.messages.forEach(msg => addMessage(msg.content, msg.role === 'user' ? 'user' : 'ai'));
  } catch(e) {}
}
 
function clearChat() {
  currentSessionId = null;
  document.getElementById('chat').innerHTML = '';
}
 
async function clearAllChats() {
  if (!confirm("Delete ALL chat history?")) return;
  try {
    await fetch('http://localhost:8000/api/chats', { method: 'DELETE' });
  } catch(e) {}
  document.getElementById('chat').innerHTML = '';
  currentSessionId = null;
  loadChats();
}
 
// ── Init: show login page ──
showLoginPage();
 
// Allow pressing Enter on login fields
['loginEmail','loginPassword'].forEach(id => {
  document.getElementById(id).addEventListener('keypress', e => {
    if (e.key === 'Enter') doLogin();
  });
});
 
</script>
</body>
</html>
