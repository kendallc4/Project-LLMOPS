<!DOCTYPE html>
<html>
<head>
  <title>Ollama Chatbot</title>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'EB Garamond', serif;
  background: #3f4a4f;
  color: white;
  display: flex;
  height: 100vh;
}

.sidebar {
  width: 260px;
  background: #2f3437;
  padding: 20px;
  box-sizing: border-box;
  overflow-y: auto;
}

.sidebar h2 {
  font-size: 18px;
  font-weight: 400;
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: #49636b;
  padding: 20px;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.top-controls {
  display: flex;
  gap: 15px;
}

.pill {
  background: #e6e6e6;
  color: #333;
  padding: 8px 14px;
  border-radius: 20px;
  font-size: 14px;
  border: none;
}

.profile {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: #6dd3c7;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  cursor: pointer;
}

.chat-wrapper {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
}

#chat {
  width: 80%;
  max-width: 800px;
  height: 60vh;
  background: #9fb1b7;
  border-radius: 18px;
  padding: 15px;
  overflow-y: auto;
  color: black;
}

.bottom-bar {
  display: flex;
  justify-content: center;
  margin-top: 20px;
}

.input-container {
  width: 80%;
  max-width: 800px;
  display: flex;
  align-items: center;
  gap: 10px;
}

#input {
  flex: 1;
  padding: 14px;
  border-radius: 20px;
  border: none;
  font-size: 16px;
}

.send-btn {
  background: #6dd3c7;
  border: none;
  padding: 12px 20px;
  border-radius: 12px;
  font-size: 18px;
  cursor: pointer;
}

.icon-btn {
  background: #e6e6e6;
  border: none;
  border-radius: 12px;
  padding: 10px;
  cursor: pointer;
}

.message {
  margin-bottom: 10px;
  padding: 8px;
  border-radius: 8px;
  word-wrap: break-word;
  overflow-wrap: break-word;
  word-break: break-word;
}

.user-message {
  background: #d6ecff;
}

.ai-message {
  background: #e6ffe6;
}

.error-message {
  background: #ffd6d6;
}

#filePreview {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}

.file-chip {
  background: #e6e6e6;
  color: #000;
  padding: 6px 10px;
  border-radius: 12px;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.file-chip img {
  width: 25px;
  height: 25px;
  object-fit: cover;
  border-radius: 5px;
}

.settings-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.4);
  display: none;
  justify-content: flex-end;
}

.settings-panel {
  width: 320px;
  height: 100%;
  background: #2f3437;
  padding: 25px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.settings-panel h2 {
  margin: 0 0 10px 0;
  font-weight: 400;
}

.settings-field {
  display: flex;
  flex-direction: column;
}

.settings-field label {
  font-size: 13px;
  margin-bottom: 5px;
}

.settings-field input {
  padding: 10px;
  border-radius: 10px;
  border: none;
}

.settings-btn {
  padding: 12px;
  border: none;
  border-radius: 12px;
  background: #6dd3c7;
  cursor: pointer;
  font-size: 14px;
}

.logout-btn {
  margin-top: auto;
  background: #ff6b6b;
}

@media (max-width: 800px) {
  .sidebar {
    display: none;
  }

  #chat {
    width: 100%;
    height: 50vh;
  }

  .input-container {
    width: 100%;
  }
}
</style>
</head>

<body>

<div class="sidebar">
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <h2>Chat history</h2>
    <button class="icon-btn" onclick="clearAllChats()">🗑️</button>
  </div>
</div>

<div class="main">

  <div class="topbar">
    <div class="top-controls">
      <label class="pill">
        File Upload
        <input type="file" id="fileInput" hidden multiple>
      </label>

      <select id="model" class="pill">
        <option value="llava:latest">LLaVA</option>
        <option value="qwen2.5-coder:7b">Qwen</option>
        <option value="dolphin-mistral:latest">Mistral</option>
      </select>
    </div>

    <div class="profile" onclick="toggleSettings()">👤</div>
  </div>

  <div id="filePreview"></div>

  <div class="chat-wrapper">
    <div id="chat"></div>
  </div>

  <div class="bottom-bar">
    <div class="input-container">
      <button class="icon-btn" onclick="clearChat()">🔄</button>
      <input type="text" id="input" placeholder="Type message..." 
        onkeypress="if(event.key==='Enter'){sendMessage()}">
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
  </div>

</div>

<div class="settings-overlay" id="settingsOverlay" onclick="outsideClick(event)">
  <div class="settings-panel">
    <h2>Account</h2>

    <div class="settings-field">
      <label>Name</label>
      <input id="nameInput" type="text" placeholder="Your name">
    </div>

    <div class="settings-field">
      <label>Email</label>
      <input id="emailInput" type="email" placeholder="Your email">
    </div>

    <button class="settings-btn" onclick="saveSettings()">Save</button>

    <button class="settings-btn">Change Password</button>
    <button class="settings-btn">Security Key</button>

    <button class="settings-btn logout-btn" onclick="logout()">Log Out</button>
  </div>
</div>

<script>

let chatHistory = [];
let uploadedFiles = [];
let currentSessionId = null;

let user = {
  id: null,
  name: null,
  email: null,
  token: null
};

function toggleSettings() {
  const el = document.getElementById('settingsOverlay');
  el.style.display = el.style.display === 'flex' ? 'none' : 'flex';
}

function outsideClick(e) {
  if (e.target.id === 'settingsOverlay') toggleSettings();
}

function addMessage(content, type) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = `message ${type}-message`;
  div.innerHTML = `<strong>${type === 'user' ? 'You' : 'AI'}:</strong> ${content}`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function saveSettings() {
  user.name = document.getElementById('nameInput').value;
  user.email = document.getElementById('emailInput').value;

  localStorage.setItem('user_name', user.name);
  localStorage.setItem('user_email', user.email);
}

function logout() {
  user = { id: null, name: null, email: null, token: null };
  document.getElementById('nameInput').value = '';
  document.getElementById('emailInput').value = '';
  localStorage.removeItem('user_name');
  localStorage.removeItem('user_email');
}

window.onload = () => {
  user.name = localStorage.getItem('user_name');
  user.email = localStorage.getItem('user_email');

  if (user.name) document.getElementById('nameInput').value = user.name;
  if (user.email) document.getElementById('emailInput').value = user.email;
};

document.getElementById('fileInput').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files);
  uploadedFiles = [];

  const preview = document.getElementById('filePreview');
  preview.innerHTML = "";

  for (const file of files) {

    const base64 = await new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.readAsDataURL(file);
    });

    let type = "text";
    if (file.type.startsWith("image/")) type = "image";
    else if (file.type === "application/pdf") type = "pdf";

    const fileObj = {
      type,
      name: file.name,
      content: base64
    };

    uploadedFiles.push(fileObj);

    const chip = document.createElement("div");
    chip.className = "file-chip";

    if (type === "image") {
      const img = document.createElement("img");
      img.src = base64;
      chip.appendChild(img);
    }

    const label = document.createElement("span");
    label.innerText = file.name;

    const remove = document.createElement("button");
    remove.innerText = "x";
    remove.style.marginLeft = "6px";
    remove.style.border = "none";
    remove.style.cursor = "pointer";

    remove.onclick = () => {
      uploadedFiles = uploadedFiles.filter(f => f !== fileObj);
      chip.remove();
    };

    chip.appendChild(label);
    chip.appendChild(remove);

    preview.appendChild(chip);
  }
});

async function sendMessage() {
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const message = input.value.trim();
  const model = document.getElementById('model').value;

  if (!message) return;

  addMessage(message, 'user');
  input.value = '';
  sendBtn.disabled = true;

  try {
    const response = await fetch('http://localhost:8000/api/generate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        model,
        prompt: message,
        files: uploadedFiles,
        session_id: currentSessionId,
        rag_enabled: true,
        user_id: user.id
      })
    });

    const data = await response.json();

    currentSessionId = data.session_id;

    addMessage(data.response || "No response", 'ai');

    uploadedFiles = [];
    document.getElementById('filePreview').innerHTML = "";
    document.getElementById('fileInput').value = "";

  } catch (err) {
    addMessage("Error: " + err.message, 'error');
  }

  sendBtn.disabled = false;
}

</script>

</body>
</html>
