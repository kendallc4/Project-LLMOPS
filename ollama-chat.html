<!DOCTYPE html>
<html>
<head>
  <title>Ollama Chatbot</title>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'EB Garamond', serif;
  background: #3f4a4f;
  color: white;
  display: flex;
  height: 100vh;
}

/*sidebar*/
.sidebar {
  width: 260px;
  background: #2f3437;
  padding: 20px;
  box-sizing: border-box;
  overflow-y: auto; /* ✅ scroll */
}

.sidebar h2 {
  font-size: 18px;
  font-weight: 400;
}

/*main area*/
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: #49636b;
  padding: 20px;
}

/*top bar*/
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.top-controls {
  display: flex;
  gap: 15px;
}

.pill {
  background: #e6e6e6;
  color: #333;
  padding: 8px 14px;
  border-radius: 20px;
  font-size: 14px;
  border: none;
}

.profile {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: #6dd3c7;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}

/*chatbox*/
.chat-wrapper {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
}

#chat {
  width: 80%;
  max-width: 800px;
  height: 60vh;
  background: #9fb1b7;
  border-radius: 18px;
  padding: 15px;
  overflow-y: auto;
  color: black;
}

/*input*/
.bottom-bar {
  display: flex;
  justify-content: center;
  margin-top: 20px;
}

.input-container {
  width: 80%;
  max-width: 800px;
  display: flex;
  align-items: center;
  gap: 10px;
}

#input {
  flex: 1;
  padding: 14px;
  border-radius: 20px;
  border: none;
  font-size: 16px;
}

.send-btn {
  background: #6dd3c7;
  border: none;
  padding: 12px 20px;
  border-radius: 12px;
  font-size: 18px;
  cursor: pointer;
}

.icon-btn {
  background: #e6e6e6;
  border: none;
  border-radius: 12px;
  padding: 10px;
  cursor: pointer;
}

/*messages*/
.message {
  margin-bottom: 10px;
  padding: 8px;
  border-radius: 8px;
  word-wrap: break-word;     
  overflow-wrap: break-word; 
  word-break: break-word;
}

.user-message {
  background: #d6ecff;
}

.ai-message {
  background: #e6ffe6;
}

.error-message {
  background: #ffd6d6;
}

/*mobile*/
@media (max-width: 800px) {
  .sidebar {
    display: none;
  }

  #chat {
    width: 100%;
    height: 50vh;
  }

  .input-container {
    width: 100%;
  }
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <h2>Chat history</h2>
    <button class="icon-btn" onclick="clearAllChats()">🗑️</button>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="top-controls">
      <label class="pill">
        File Upload
        <input type="file" id="fileInput" hidden multiple>
      </label>

      <select id="model" class="pill">
        <option value="llava:latest">LLaVA</option>
        <option value="qwen2.5-coder:7b">Qwen</option>
        <option value="dolphin-mistral:latest">Mistral</option>
      </select>
    </div>

    <div class="profile">👤</div>
  </div>

  <!-- CHAT -->
  <div class="chat-wrapper">
    <div id="chat"></div>
  </div>

  <!-- INPUT -->
  <div class="bottom-bar">
    <div class="input-container">
      <button class="icon-btn" onclick="clearChat()">🔄</button>
      <input type="text" id="input" placeholder="Type message..." 
        onkeypress="if(event.key==='Enter'){sendMessage()}">
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
  </div>

</div>

<script>

let chatHistory = [];
let uploadedFiles = [];
let currentSessionId = null;

function addMessage(content, type) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = `message ${type}-message`;
  div.innerHTML = `<strong>${type === 'user' ? 'You' : 'AI'}:</strong> ${content}`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function addLoadingMessage() {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.id = 'loading';
  div.innerText = "Thinking...";
  chat.appendChild(div);
  return div;
}

function removeLoadingMessage() {
  const el = document.getElementById('loading');
  if (el) el.remove();
}

/*file upload*/

document.getElementById('fileInput').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files);
  uploadedFiles = [];

  for (const file of files) {
    const base64 = await new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.readAsDataURL(file);
    });

    let type = "text";

    if (file.type.startsWith("image/")) type = "image";
    else if (file.type === "application/pdf") type = "pdf";

    uploadedFiles.push({
      type,
      name: file.name,
      content: base64
    });
  }
});

/*Send Message*/

async function sendMessage() {
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const message = input.value.trim();
  const model = document.getElementById('model').value;

  if (!message) return;

  addMessage(message, 'user');
  input.value = '';
  sendBtn.disabled = true;

  const loading = addLoadingMessage();

  try {
    const response = await fetch('http://localhost:8000/api/generate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        model: model,
        prompt: message,
        files: uploadedFiles,
        session_id: currentSessionId,
        rag_enabled: true
      })
    });

    const data = await response.json();

    removeLoadingMessage();

    currentSessionId = data.session_id;

    addMessage(data.response || "No response", 'ai');

    loadChats();

  } catch (err) {
    removeLoadingMessage();
    addMessage("Error: " + err.message, 'error');
  }

  sendBtn.disabled = false;
}

/*Chat History*/

async function loadChats() {
  const res = await fetch('http://localhost:8000/api/chats');
  const chats = await res.json();

  const sidebar = document.querySelector('.sidebar');
  sidebar.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2>Chat history</h2>
      <button class="icon-btn" onclick="clearAllChats()">🗑️</button>
    </div>
  `;

  chats.reverse().forEach(chat => {
    const wrapper = document.createElement('div');
    wrapper.style.display = 'flex';
    wrapper.style.justifyContent = 'space-between';
    wrapper.style.alignItems = 'center';
    wrapper.style.marginBottom = '10px';
    wrapper.style.background = '#3a3f42';
    wrapper.style.padding = '6px';
    wrapper.style.borderRadius = '6px';

    const title = document.createElement('div');
    title.style.cursor = 'pointer';
    title.innerText = chat.preview || "New Chat";
    title.onclick = () => loadChat(chat.id);

    const delBtn = document.createElement('button');
    delBtn.innerText = '❌';
    delBtn.style.background = 'transparent';
    delBtn.style.border = 'none';
    delBtn.style.cursor = 'pointer';
    delBtn.style.color = 'white';

    delBtn.onclick = async (e) => {
      e.stopPropagation();
      await fetch(`http://localhost:8000/api/chats/${chat.id}`, {
        method: 'DELETE'
      });
      loadChats();
    };

    wrapper.appendChild(title);
    wrapper.appendChild(delBtn);

    sidebar.appendChild(wrapper);
  });
}

async function loadChat(sessionId) {
  const res = await fetch(`http://localhost:8000/api/chats/${sessionId}`);
  const chat = await res.json();

  currentSessionId = sessionId;

  const chatDiv = document.getElementById('chat');
  chatDiv.innerHTML = '';

  chat.messages.forEach(msg => {
    addMessage(msg.content, msg.role === 'user' ? 'user' : 'ai');
  });
}

function clearChat() {
  currentSessionId = null;
  document.getElementById('chat').innerHTML = '';
}

/*Clear all History*/
async function clearAllChats() {
  if (!confirm("Delete ALL chat history?")) return;

  await fetch('http://localhost:8000/api/chats', {
    method: 'DELETE'
  });

  document.getElementById('chat').innerHTML = '';
  currentSessionId = null;

  loadChats();
}

loadChats();
document.getElementById('input').focus();

</script>

</body>
</html>
