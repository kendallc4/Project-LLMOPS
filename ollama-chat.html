<!DOCTYPE html>
<html>
<head>
  <title>Ollama Chatbot with RAG & Vision</title>
  <!-- Load EB Garamond from Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'EB Garamond', serif;
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px;
    background-color: #343b3f;
    color: #a3b6bd;
  }

  .container {
    background: #3d5b68;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
  }

h1 {
    color: #f5f5f5; /* was f5f5f5, missing # */
    text-align: center;
    margin-bottom: 25px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  #chat { 
    background: #3d5b68; /* changed from white #fafafa to dark color */
    color: #f5f5f5; /* ensures text is readable */
  }

  .controls {
    display: flex;
    gap: 18px;
    margin-bottom: 25px;
    flex-wrap: wrap;
    align-items: center;
  }

  .model-selector {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  select { 
    padding: 10px 36px 10px 14px;
    border: 1px solid #aab7be;
    border-radius: 6px;
    font-size: 15px;
    font-family: 'EB Garamond', serif;
    background-color: #fdfdfd;
    color: #2a2a2a;

    /* cleaner dropdown look */
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;

    /* custom arrow */
    background-image: url("data:image/svg+xml;utf8,<svg fill='%23333' height='10' viewBox='0 0 20 20'><path d='M5 7l5 5 5-5z'/></svg>");
    background-repeat: no-repeat;
    background-position: right 12px center;
  }

  select:focus {
    outline: none;
    border-color: #8899a1;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.1);
  }

  .file-upload {
    display: flex;
    align-items: center;
    gap: 12px;
  }
        .file-input {
            display: none;
        }
        .file-button {
            padding: 8px 16px;
            background: #66e0cc;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .file-button:hover {
            background: #218838;
        }
        .uploaded-files {
            margin-bottom: 15px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 5px;
            border: 1px solid #e9ecef;
        }
        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px;
            margin-bottom: 5px;
            background: white;
            border-radius: 3px;
            border: 1px solid #dee2e6;
        }
        .file-item:last-child {
            margin-bottom: 0;
        }
  </style>
